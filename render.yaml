services:
  - type: worker
    name: cartesia-telegram-bot
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r telegram_bot/requirements.txt
    startCommand: python telegram_bot/bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CARTESIA_API_KEY
        value: sk_car_x62gquQgEdVchAVtPCxcue
      - key: PYTHONUNBUFFERED
        value: "1"
